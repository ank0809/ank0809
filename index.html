<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff6a88, #ff99ac);
    color: #fff;
    text-align: center;
    padding: 20px;
    overflow-x: hidden;
}

h1 {
    font-size: 2.3rem;
    margin-top: 25px;
}

p {
    font-size: 1.1rem;
    line-height: 1.6;
}

/* Floating hearts */
.heart {
    position: fixed;
    bottom: -20px;
    font-size: 20px;
    animation: float 6s linear infinite;
    opacity: 0.7;
}
@keyframes float {
    from { transform: translateY(0); opacity: 0.8; }
    to { transform: translateY(-100vh); opacity: 0; }
}

/* Card */
.card-box {
    background: rgba(255,255,255,0.18);
    border-radius: 25px;
    padding: 25px;
    margin: 40px auto;
    max-width: 340px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

.hidden { display: none; }

.valentine-question {
    font-size: 1.5rem;
    font-weight: bold;
    margin-bottom: 18px;
}

.answer-btn {
    background: #fff;
    color: #ff4d6d;
    border: none;
    padding: 10px 22px;
    border-radius: 25px;
    margin: 8px;
    font-size: 1rem;
    cursor: pointer;
    position: relative;
}

/* Shake */
@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
}
.shake { animation: shake 0.4s; }

/* Ring */
.ring {
    font-size: 4.5rem;
    margin: 15px 0;
}

/* Typing */
.typing {
    font-size: 1.05rem;
    line-height: 1.6;
}

/* Confetti */
.confetti {
    position: fixed;
    top: -10px;
    font-size: 18px;
    animation: confettiFall 3s linear forwards;
}
@keyframes confettiFall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

/* Sparkle */
.sparkle {
    position: fixed;
    font-size: 18px;
    animation: sparkle 1.5s ease-out forwards;
}
@keyframes sparkle {
    to { opacity: 0; transform: scale(2); }
}
</style>
</head>

<body onclick="enableSound()">

<h1>Hey You ❤️</h1>

<p>
I made this little page for you,<br>
because some feelings deserve more than just words 💕
</p>

<div class="card-box">
    <div id="question">
        <div class="valentine-question">
            Will you be my Valentine? ❤️
        </div>

        <p id="noText" style="opacity:0.9;">Soch lo ache se 😌</p>

        <button class="answer-btn" onclick="sayYes(event)">Yes 💖</button>
        <button class="answer-btn" id="noBtn"
                onclick="sayNo()"
                onmouseover="runAway()">No 🙃</button>
    </div>

    <div id="yesScreen" class="hidden">
        <div class="ring">💍</div>
        <div id="typing" class="typing"></div>
    </div>
</div>

<p style="font-size:0.9rem; opacity:0.9;">(tap anywhere to enable music 🎶)</p>

<audio id="bgMusic" loop muted>
    <source src="https://raw.githubusercontent.com/ank0809/Rose-day/e8b44a007b0661bc1c584f677fe703e3a44e7676/tum-se-hi-from-jab-we-met_8h436GOY.mp3" type="audio/mpeg">
</audio>

<footer style="margin-top:40px; font-size:0.95rem;">
Always yours,<br>
<b>Your Farzi Engineer 😌</b>
</footer>

<script>
/* Hearts */
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
}
setInterval(createHeart, 450);

/* Music */
let soundEnabled = false;
function enableSound() {
    if (!soundEnabled) {
        const music = document.getElementById("bgMusic");
        music.muted = false;
        music.play();
        soundEnabled = true;
    }
}

/* NO logic */
let noCount = 0;
const noLines = [
    "Are you sure? 😅",
    "Ek baar soch lo na 🥺",
    "Itna bhi bhaav mat khao 😌",
    "Dil thoda sa hurt hua 💔",
    "YES bolne me zyada cute lagogi 😏",
    "Bas thoda sa… please 🥹",
    "Almost maan hi gayi lagta hai 😬",
    "Last try… pakka 😔",
    "Bas ab sirf YES bacha 😄"
];

function sayNo() {
    const btn = document.getElementById("noBtn");
    btn.classList.add("shake");
    setTimeout(() => btn.classList.remove("shake"), 400);

    if (noCount < noLines.length) {
        document.getElementById("noText").innerText = noLines[noCount];
        noCount++;
    }
    if (noCount >= 9) {
        btn.style.display = "none";
    }
}

function runAway() {
    const btn = document.getElementById("noBtn");
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 200 - 100;
    btn.style.transform = `translate(${x}px, ${y}px)`;
}

/* YES */
function sayYes(e) {
    e.stopPropagation();
    document.getElementById("question").classList.add("hidden");
    document.getElementById("yesScreen").classList.remove("hidden");
    startTyping();
    launchConfetti();
    launchSparkles();
}

/* Typing */
const lines = [
    "Hum mile randomly…",
    "aur maine kabhi socha nahi tha,",
    "ki main tumhe itna chahne lagunga 💭",
    "",
    "Kehte hain kuch bhi accidentally nahi hota…",
    "shayad tumse milna bhi destiny ka hi plan tha ✨",
    "",
    "Tumse baat karke laga,",
    "tum wahi ho jiska main intezaar kar raha tha 🤍"
];
let i = 0, j = 0;
function startTyping() {
    const el = document.getElementById("typing");
    if (i < lines.length) {
        if (j < lines[i].length) {
            el.innerHTML += lines[i][j++];
            setTimeout(startTyping, 45);
        } else {
            el.innerHTML += "<br>";
            i++; j = 0;
            setTimeout(startTyping, 350);
        }
    }
}

/* Confetti + Sparkle */
function launchConfetti() {
    for (let i = 0; i < 30; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.innerHTML = ["💖","✨","🎉"][Math.floor(Math.random()*3)];
        c.style.left = Math.random() * 100 + "vw";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3000);
    }
}

function launchSparkles() {
    for (let i = 0; i < 12; i++) {
        const s = document.createElement("div");
        s.className = "sparkle";
        s.innerHTML = "✨";
        s.style.left = (45 + Math.random()*10) + "%";
        s.style.top = (45 + Math.random()*10) + "%";
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1500);
    }
}
</script>

</body>
</html>
