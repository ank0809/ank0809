<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff6a88, #ff99ac);
    color: #fff;
    text-align: center;
    padding: 20px;
    overflow-x: hidden;
}

h1 {
    font-size: 2.3rem;
    margin-top: 25px;
}

p {
    font-size: 1.1rem;
    line-height: 1.6;
}

/* Floating hearts */
.heart {
    position: fixed;
    bottom: -20px;
    font-size: 20px;
    animation: float 6s linear infinite;
    opacity: 0.7;
}
@keyframes float {
    from { transform: translateY(0); opacity: 0.8; }
    to { transform: translateY(-100vh); opacity: 0; }
}

/* Card */
.card-box {
    background: rgba(255,255,255,0.18);
    border-radius: 25px;
    padding: 25px;
    margin: 40px auto;
    max-width: 340px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

.hidden { display: none; }

.valentine-question {
    font-size: 1.5rem;
    font-weight: bold;
    margin-bottom: 18px;
}

.answer-btn {
    background: #fff;
    color: #ff4d6d;
    border: none;
    padding: 10px 22px;
    border-radius: 25px;
    margin: 8px;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
}

/* Ring */
.ring {
    font-size: 4rem;
    animation: ringPop 1s ease forwards;
}
@keyframes ringPop {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); }
}

/* Confetti */
.confetti {
    position: fixed;
    top: -10px;
    font-size: 18px;
    animation: confettiFall 3s linear forwards;
}
@keyframes confettiFall {
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

footer {
    margin-top: 45px;
    font-size: 0.95rem;
}
</style>
</head>

<body onclick="enableSound()">

<h1>Hey You ❤️</h1>

<p>
I made this little page for you,<br>
because some feelings deserve more than just words 💕
</p>

<div class="card-box" onclick="openCard()">
    <div id="closedCard">
        💌 Tap to open this 💌
        <p style="font-size:0.9rem;">(trust me)</p>
    </div>

    <div id="openCard" class="hidden">
        <div class="valentine-question">
            Will you be my Valentine? ❤️
        </div>

        <button class="answer-btn" onclick="sayYes(event)">Yes 💖</button>
        <button class="answer-btn" id="noBtn" onclick="handleNo()">No 🙃</button>

        <div id="response" class="hidden"></div>
    </div>
</div>

<p style="font-size:0.9rem;">(tap anywhere to enable music 🎶)</p>

<audio id="bgMusic" autoplay loop muted>
    <source src="https://raw.githubusercontent.com/ank0809/Rose-day/e8b44a007b0661bc1c584f677fe703e3a44e7676/tum-se-hi-from-jab-we-met_8h436GOY.mp3" type="audio/mpeg">
</audio>

<footer>
Always yours,<br>
<b>Your Farzi Engineer 😌</b>
</footer>

<!-- Floating Hearts -->
<script>
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
}
setInterval(createHeart, 450);
</script>

<script>
let soundEnabled = false;
let noClickCount = 0;

const funnyNoLines = [
    "Arre soch le yaar 😏",
    "Itni jaldi NO? Dil thoda sa dukha 💔",
    "Tum itni strong kyun ho 😭",
    "Dil bola — ek aur try 💖",
    "Tumhe manaana bhi cute lagta hai 😌",
    "Universe still waiting ✨",
    "Bas bas… attitude noted 😎",
    "Okay fine… destiny jeet gayi ❤️"
];

function enableSound() {
    if (!soundEnabled) {
        const music = document.getElementById("bgMusic");
        music.muted = false;
        music.play();
        soundEnabled = true;
    }
}

function openCard() {
    document.getElementById("closedCard").classList.add("hidden");
    document.getElementById("openCard").classList.remove("hidden");
}

/* NO button (NO FLOATING) */
function handleNo() {
    const btn = document.getElementById("noBtn");
    const response = document.getElementById("response");

    noClickCount++;

    response.classList.remove("hidden");
    response.innerHTML = `<p>${funnyNoLines[Math.min(noClickCount - 1, funnyNoLines.length - 1)]}</p>`;

    if (noClickCount >= 8) {
        btn.innerHTML = "Yes 💖";
        btn.style.background = "#ff4d6d";
        btn.style.color = "#fff";
        btn.onclick = sayYes;
        response.innerHTML = `<p>Ab NO ka option hi nahi raha 😌❤️</p>`;
    }
}

/* YES */
function sayYes(e) {
    if (e) e.stopPropagation();

    const response = document.getElementById("response");
    response.classList.remove("hidden");

    response.innerHTML = `
        <div class="ring">💍</div>

        <p>
        Accidentally mile apn…<br>
        aur pata bhi nahi chala kab tum<br>
        <b>itne khaas ho gaye</b> mere liye ❤️
        </p>

        <p>
        Wo kehte hain na,<br>
        accidently kuch nahi hota,<br>
        sab destiny ka plan hota hai ✨
        </p>

        <p>
        Tumhara behaviour,<br>
        tumhari care,<br>
        aur tumhari simplicity<br>
        mujhe har din tumhari taraf kheench leti hai 💕
        </p>

        <p>
        <b>Shayad isiliye YES bolna itna easy laga 😌</b>
        </p>
    `;

    launchConfetti();
}

/* Confetti */
function launchConfetti() {
    for (let i = 0; i < 30; i++) {
        const conf = document.createElement("div");
        conf.className = "confetti";
        conf.innerHTML = ["🎉","💖","✨","💍"][Math.floor(Math.random()*4)];
        conf.style.left = Math.random() * 100 + "vw";
        conf.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 3000);
    }
}
</script>

</body>
</html>
