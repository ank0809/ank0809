<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff6a88, #ff99ac);
    color: #fff;
    text-align: center;
    padding: 20px;
    overflow-x: hidden;
}

.hidden { display: none; }

h1 { font-size: 2.3rem; margin-top: 15px; }
p { font-size: 1.1rem; line-height: 1.7; }

.card-box {
    background: rgba(255,255,255,0.18);
    border-radius: 25px;
    padding: 25px;
    margin: 30px auto;
    max-width: 340px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

.answer-btn {
    background: #fff;
    color: #ff4d6d;
    border: none;
    padding: 10px 22px;
    border-radius: 25px;
    margin: 8px;
    font-size: 1rem;
    cursor: pointer;
}

/* 🐻🐰 Cartoon bounce */
.cartoon {
    font-size: 3.2rem;
    animation: bounce 2s infinite;
}
@keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* 😈 Shake */
@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-6px); }
    100% { transform: translateX(0); }
}
.shake { animation: shake 0.4s; }

/* 💍 Ring */
.big-ring {
    font-size: 7rem;
    animation: pop 1.2s ease forwards;
}
@keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); }
}

/* 💗 Floating hearts */
.heart {
    position: fixed;
    bottom: -20px;
    font-size: 20px;
    animation: float 6s linear infinite;
    opacity: 0.7;
}
@keyframes float {
    to { transform: translateY(-100vh); opacity: 0; }
}
</style>
</head>

<body onclick="enableSound()">

<!-- 🌸 FIRST SCREEN -->
<div id="mainContent">
    <div class="cartoon">🐻💕🐰</div>

    <h1>Hey You ❤️</h1>
    <p>
        Thoda sa cute, thoda sa crazy,<br>
        aur kaafi saara pyaar — bas tumhare liye 🥹
    </p>

    <div class="card-box" onclick="openCard(event)">
        <div id="closedCard">💌 Tap to open this 💌</div>

        <div id="openCard" class="hidden">
            <p style="font-size:1.4rem;font-weight:bold;">
                Will you be my Valentine? ❤️
            </p>
            <button class="answer-btn" onclick="sayYes(event)">Yes 💖</button>
            <button class="answer-btn" id="noBtn" onclick="handleNo()">No 🙃</button>
        </div>
    </div>
</div>

<!-- 💍 FINAL SCREEN -->
<div id="finalScreen" class="hidden">
    <div class="cartoon">🐻💍🐰</div>
    <div class="big-ring">💍</div>
    <div id="typingText" style="margin-top:20px;opacity:0.96;"></div>
</div>

<!-- 🎵 MUSIC -->
<audio id="bgMusic" autoplay loop muted>
    <source src="https://raw.githubusercontent.com/ank0809/Rose-day/e8b44a007b0661bc1c584f677fe703e3a44e7676/tum-se-hi-from-jab-we-met_8h436GOY.mp3" type="audio/mpeg">
</audio>

<script>
/* 💗 Hearts */
setInterval(()=>{
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="💗";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),7000);
},450);

/* 🎵 Music */
let soundEnabled=false;
function enableSound(){
    if(!soundEnabled){
        bgMusic.muted=false;
        bgMusic.play();
        soundEnabled=true;
    }
}

/* Open card */
function openCard(e){
    e.stopPropagation();
    closedCard.classList.add("hidden");
    openCardDiv.classList.remove("hidden");
}
const openCardDiv=document.getElementById("openCard");

/* 😈 NO logic */
let noCount=0;
function handleNo(){
    noCount++;
    const btn=document.getElementById("noBtn");

    btn.classList.add("shake");
    setTimeout(()=>btn.classList.remove("shake"),400);

    btn.style.transform=`translate(${Math.random()*200-100}px,${Math.random()*200-100}px)`;

    alert("Ek baar phir soch lo na 🥺");

    if(noCount>=9){
        btn.remove();
    }
}

/* 💍 YES logic */
function sayYes(e){
    e.stopPropagation();
    document.getElementById("mainContent").remove();
    document.getElementById("finalScreen").classList.remove("hidden");
    startTyping();
}

/* ✨ Typing Effect (line by line) */
const lines = [
    "Hum mile bilkul randomly…",
    "aur sach kahun toh mujhe kabhi laga hi nahi tha",
    "ki main kisi ko itna chahne lagunga 🥹❤️",
    "",
    "Kehte hain na, kuch bhi accidentally nahi hota,",
    "shayad humara milna bhi destiny ka hi plan tha ✨",
    "",
    "Tumse baat karte karte laga,",
    "jaise tum wahi ho jiska intezaar",
    "mera dil kabse kar raha tha 💕",
    "",
    "Agar pyaar ek kahaani hoti,",
    "toh meri favourite line tum hoti 😌❤️"
];

let lineIndex = 0;
let charIndex = 0;

function startTyping(){
    const container = document.getElementById("typingText");
    if(lineIndex >= lines.length) return;

    if(charIndex < lines[lineIndex].length){
        container.innerHTML += lines[lineIndex].charAt(charIndex);
        charIndex++;
        setTimeout(startTyping, 45);
    } else {
        container.innerHTML += "<br><br>";
        lineIndex++;
        charIndex = 0;
        setTimeout(startTyping, 600);
    }
}
</script>

</body>
</html>
