<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Only For You 💖</title>

<style>
body{
    margin:0;
    height:100vh;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ff6a88,#ff99ac);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:#fff;
}

/* CARD */
.container{
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(10px);
    padding:30px;
    border-radius:25px;
    text-align:center;
    width:90%;
    max-width:420px;
    z-index:2;
}

.hidden{display:none;}

h1{font-size:26px;}
p{font-size:16px;}

.buttons{
    margin-top:20px;
    position:relative;
    height:120px;
}

button{
    padding:12px 26px;
    border:none;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
}

#yesBtn{
    background:#ff4d6d;
    color:#fff;
}

#noBtn{
    background:#fff;
    color:#ff4d6d;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}

/* SHAKE */
@keyframes shake{
    0%{transform:translateX(-50%)}
    25%{transform:translateX(-56%)}
    50%{transform:translateX(-44%)}
    75%{transform:translateX(-56%)}
    100%{transform:translateX(-50%)}
}
.shake{animation:shake 0.4s}

/* YES SCREEN */
.ring{font-size:90px;margin:10px 0}
.typing{font-size:17px;line-height:1.6}

/* HEARTS */
.heart{
    position:fixed;
    bottom:-10px;
    font-size:20px;
    animation:floatUp 6s linear infinite;
}
@keyframes floatUp{
    to{transform:translateY(-110vh);opacity:0}
}

/* CONFETTI */
.confetti{
    position:fixed;
    width:8px;
    height:14px;
    top:-10px;
    animation:fall 3s linear forwards;
}
@keyframes fall{
    to{transform:translateY(110vh) rotate(360deg)}
}

/* SPARKLES */
.sparkle{
    position:fixed;
    font-size:18px;
    animation:spark 1.5s ease-out forwards;
}
@keyframes spark{
    to{opacity:0;transform:scale(2)}
}

/* FIREWORKS */
.firework{
    position:fixed;
    width:6px;
    height:6px;
    border-radius:50%;
    animation:boom 1.5s ease-out forwards;
}
@keyframes boom{
    to{
        transform:translate(var(--x),var(--y));
        opacity:0;
    }
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="rhnuma_raone_srk.mp3" type="audio/mpeg">
</audio>

<div class="container">

<!-- QUESTION -->
<div id="question">
    <div style="font-size:70px;">🐻💗🐼</div>
    <h1>Will you be my Valentine? 💖</h1>
    <p id="noText">Soch lo ache se 😌</p>

    <div class="buttons">
        <button id="yesBtn" onclick="sayYes()">YES 💕</button>
        <button id="noBtn"
            onclick="sayNo()"
            onmouseover="moveNo()"
            ontouchstart="moveNo()">NO 🙃</button>
    </div>
</div>

<!-- YES SCREEN -->
<div id="yesScreen" class="hidden">
    <div class="ring">💍</div>
    <div style="font-size:80px;">🐻‍❄️💞🐼</div>
    <div id="typing" class="typing"></div>
</div>

</div>

<script>
const music=document.getElementById("music");
let noCount=0;

const noLines=[
"Are you sure? 😳",
"Ek baar YES try karo na 🥺",
"Itna bhaav mat khao 😌",
"Dil thoda sa pighalne do 💗",
"Itni baar NO bol diya… YES bhi banta hai 😇",
"Main bura nahi hoon, promise 🫣",
"YES bolne me zyada cute lagogi 😏",
"Last chance… pakka 😬",
"Bas bas 😂 sirf YES bacha"
];

function sayNo(){
    music.play();
    noCount++;
    const btn=document.getElementById("noBtn");
    btn.classList.add("shake");
    setTimeout(()=>btn.classList.remove("shake"),400);

    if(noCount<=noLines.length){
        document.getElementById("noText").innerText=noLines[noCount-1];
    }

    if(noCount>=9){
        btn.style.display="none";
    }
}

function moveNo(){
    const btn=document.getElementById("noBtn");
    btn.style.left=Math.random()*60+"%";
    btn.style.top=Math.random()*60+"px";
}

function sayYes(){
    music.play();
    document.getElementById("question").classList.add("hidden");
    document.getElementById("yesScreen").classList.remove("hidden");
    startTyping();
    hearts();
    confetti();
    sparkles();
    fireworks();
}

/* TYPING */
const lines=[
"Hum mile randomly…",
"aur maine kabhi socha nahi tha,",
"ki main tumhe itna chahne lagunga 💭",
"",
"Kehte hain kuch bhi accidentally nahi hota…",
"shayad tumse milna bhi destiny ka hi plan tha ✨",
"",
"Tumse baat karke laga —",
"tum wahi ho jiska main intezaar kar raha tha 🤍",
"",
"So… will you be mine? 💕"
];
let i=0,j=0;
function startTyping(){
    const el=document.getElementById("typing");
    if(i<lines.length){
        if(j<lines[i].length){
            el.innerHTML+=lines[i][j++];
            setTimeout(startTyping,45);
        }else{
            el.innerHTML+="<br>";
            i++; j=0;
            setTimeout(startTyping,350);
        }
    }
}

/* EFFECTS */
function hearts(){
    setInterval(()=>{
        const h=document.createElement("div");
        h.className="heart";
        h.innerHTML="💖";
        h.style.left=Math.random()*100+"%";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),6000);
    },400);
}

function confetti(){
    for(let i=0;i<70;i++){
        const c=document.createElement("div");
        c.className="confetti";
        c.style.left=Math.random()*100+"%";
        c.style.background=`hsl(${Math.random()*360},100%,70%)`;
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),4000);
    }
}

function sparkles(){
    for(let i=0;i<25;i++){
        const s=document.createElement("div");
        s.className="sparkle";
        s.innerHTML="✨";
        s.style.left=(40+Math.random()*20)+"%";
        s.style.top=(40+Math.random()*20)+"%";
        document.body.appendChild(s);
        setTimeout(()=>s.remove(),1500);
    }
}

function fireworks(){
    for(let i=0;i<60;i++){
        const f=document.createElement("div");
        f.className="firework";
        f.style.background=`hsl(${Math.random()*360},100%,60%)`;
        f.style.left="50%";
        f.style.top="50%";
        f.style.setProperty("--x",(Math.random()*400-200)+"px");
        f.style.setProperty("--y",(Math.random()*400-200)+"px");
        document.body.appendChild(f);
        setTimeout(()=>f.remove(),1500);
    }
}
</script>

</body>
</html>
